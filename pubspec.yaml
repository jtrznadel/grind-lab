name: grind_lab
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  get_it: ^9.0.5
  injectable: ^2.6.0
  freezed_annotation: ^3.1.0
  fpdart: ^1.2.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.2
  hugeicons: ^1.1.1
  google_fonts: ^6.3.2
  intl: ^0.20.2
  supabase_flutter: ^2.10.3
  video_player: ^2.10.1
  chewie: ^1.13.0
  font_awesome_flutter: ^10.12.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.1
  freezed: ^3.2.3

flutter:
